<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
  <style>
    .card { animation: up 1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes up { from {opacity:0; transform:translateY(20px)} to {opacity:1; transform:none} }
    .trace { animation: trace 5s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: -720 } }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% {transform:scale(.85);opacity:.10} 50% {transform:scale(1.15);opacity:.25} }
    .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-7px)} }
  </style>
  
  <g class="card" style="animation-delay:0.0s">
    <rect x="1.0" y="21" width="280.0" height="208" rx="18" fill="#0f1230"/>
    <rect x="1.0" y="21" width="280.0" height="208" rx="18" fill="none" stroke="#00e5c7" stroke-width="2" stroke-dasharray="120 600" class="trace" style="animation-delay:0.0s"/>
    <rect x="1.0" y="21" width="280.0" height="208" rx="18" fill="none" stroke="#00e5c7" stroke-opacity=".22" stroke-width="1.5"/>
    <circle cx="141.0" cy="88" r="36" fill="#00e5c7" opacity=".14" class="pulse" style="animation-delay:0.0s"/>
    <text x="141.0" y="102" text-anchor="middle" font-size="40" class="bob" style="animation-delay:0.0s">🤖</text>
    <text x="141.0" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#eef1ff">AI Agents</text>
    <text x="141.0" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa3c7">LLM agents with real tools</text>
  </g>
  <g class="card" style="animation-delay:0.25s">
    <rect x="307.0" y="21" width="280.0" height="208" rx="18" fill="#0f1230"/>
    <rect x="307.0" y="21" width="280.0" height="208" rx="18" fill="none" stroke="#8a6bff" stroke-width="2" stroke-dasharray="120 600" class="trace" style="animation-delay:0.7s"/>
    <rect x="307.0" y="21" width="280.0" height="208" rx="18" fill="none" stroke="#8a6bff" stroke-opacity=".22" stroke-width="1.5"/>
    <circle cx="447.0" cy="88" r="36" fill="#8a6bff" opacity=".14" class="pulse" style="animation-delay:0.5s"/>
    <text x="447.0" y="102" text-anchor="middle" font-size="40" class="bob" style="animation-delay:0.4s">📈</text>
    <text x="447.0" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#eef1ff">Growth Engines</text>
    <text x="447.0" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa3c7">Ads, SEO &amp; funnels on autopilot</text>
  </g>
  <g class="card" style="animation-delay:0.5s">
    <rect x="613.0" y="21" width="280.0" height="208" rx="18" fill="#0f1230"/>
    <rect x="613.0" y="21" width="280.0" height="208" rx="18" fill="none" stroke="#ff9d5c" stroke-width="2" stroke-dasharray="120 600" class="trace" style="animation-delay:1.4s"/>
    <rect x="613.0" y="21" width="280.0" height="208" rx="18" fill="none" stroke="#ff9d5c" stroke-opacity=".22" stroke-width="1.5"/>
    <circle cx="753.0" cy="88" r="36" fill="#ff9d5c" opacity=".14" class="pulse" style="animation-delay:1.0s"/>
    <text x="753.0" y="102" text-anchor="middle" font-size="40" class="bob" style="animation-delay:0.8s">☁️</text>
    <text x="753.0" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#eef1ff">Cloud Native</text>
    <text x="753.0" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa3c7">Serverless, scalable, on AWS</text>
  </g>
  <g class="card" style="animation-delay:0.75s">
    <rect x="919.0" y="21" width="280.0" height="208" rx="18" fill="#0f1230"/>
    <rect x="919.0" y="21" width="280.0" height="208" rx="18" fill="none" stroke="#ff5fae" stroke-width="2" stroke-dasharray="120 600" class="trace" style="animation-delay:2.0999999999999996s"/>
    <rect x="919.0" y="21" width="280.0" height="208" rx="18" fill="none" stroke="#ff5fae" stroke-opacity=".22" stroke-width="1.5"/>
    <circle cx="1059.0" cy="88" r="36" fill="#ff5fae" opacity=".14" class="pulse" style="animation-delay:1.5s"/>
    <text x="1059.0" y="102" text-anchor="middle" font-size="40" class="bob" style="animation-delay:1.2000000000000002s">🎬</text>
    <text x="1059.0" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#eef1ff">Gen Media</text>
    <text x="1059.0" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa3c7">AI video &amp; motion pipelines</text>
  </g>
</svg>
