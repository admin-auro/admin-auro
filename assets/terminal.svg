tomate the boring. Ship the bold."</tspan></text><g class="lc"><text x="44" y="398" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="19"><tspan fill="#00e5c7">~</tspan><tspan fill="#8a6bff"> ❯ </tspan></text><rect class="blink" x="88" y="381" width="11" height="22" fill="#00e5c7"/></g>
